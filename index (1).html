<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Price Guide</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: beidef;
    overflow: hidden;
    overscroll-behavior: none;
  }

  .viewer {
    display: flex;
    width: 100vw;
    height: 100vh;   /* fallback */
    height: 100dvh;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: none;
    touch-action: pan-x;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .viewer::-webkit-scrollbar { display: none; }

  .page {
    flex: 0 0 100%;
    width: 100vw;
    height: 100%;
    scroll-snap-align: center;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }
</style>
</head>
<body>
  <div class="viewer">
    <div class="page"><img src="price-guide1.jpg" alt="" draggable="false"></div>
    <div class="page"><img src="price-guide2.jpg" alt="" draggable="false"></div>
    <div class="page"><img src="price-guide3.jpg" alt="" draggable="false"></div>
  </div>
</body>
</html>
